name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.runner }} / LLVM ${{ matrix.llvm_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            llvm_formula: llvm@15
            llvm_version: 15
          - runner: macos-15
            llvm_formula: llvm@18
            llvm_version: 18
          - runner: macos-latest
            llvm_formula: llvm@20
            llvm_version: 20

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install bison flex

      - name: Select toolchain
        run: |
          llvm_prefix="$(brew --prefix '${{ matrix.llvm_formula }}')"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$llvm_prefix/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          cmake --version
          ninja --version
          bison --version
          flex --version
          clang --version

      - name: Configure
        run: |
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_DIR"

      - name: Build
        run: cmake --build build-macos --parallel 2

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure
